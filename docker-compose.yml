# Full stack: PostgreSQL + FastAPI + Streamlit + the task worker + the scan scheduler.
#
#   docker compose up --build
#   # first run only: seed the DB corpus the worker ranks against
#   docker compose exec api python -m backend.database.corpus import data/sample_jobs.json
#
#   UI:   http://localhost:8501
#   API:  http://localhost:8000/docs
#   DB:   localhost:5432 (ai_job_agent / see .env)
#
# ./data and ./uploads are bind-mounted, so profiles, corpora, and rankings
# are shared between containers AND with host-side CLI runs (resume tailoring
# via Ollama still runs on the host -- it needs the Ollama daemon).
#
# Rankings run on the worker: the API and UI only enqueue "rank" tasks in
# Postgres, and the worker is the single writer of data/ranked_jobs.json.
# The scheduler enqueues a "scan" (collect -> upsert -> incremental rank)
# every SCAN_CRON (default 09:00 IST); the worker runs that too.
#
# The old backend/database/docker-compose.yml still works standalone for
# DB-only local development; this file is the one-command full stack.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ai_job_agent}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password_change_me}
      POSTGRES_DB: ${DB_NAME:-ai_job_agent}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ai_job_agent} -d ${DB_NAME:-ai_job_agent}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    command: uvicorn backend.api.app:app --host 0.0.0.0 --port 8000
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-ai_job_agent}
      DB_PASSWORD: ${DB_PASSWORD:-dev_password_change_me}
      DB_NAME: ${DB_NAME:-ai_job_agent}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - models:/models
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Durable task worker (ADR-001 §2): claims queued tasks from Postgres with
  # SKIP LOCKED, heartbeats its lease, and retries failures with backoff.
  # Same image as api/ui. It refuses to start without a reachable DB.
  # `docker compose stop` sends SIGTERM: the worker stops claiming and lets
  # the current task finish within --grace. stop_grace_period must be longer
  # than that, or Docker SIGKILLs it first (the task is then retried by the
  # next worker once its lease expires).
  #
  # It also runs the agent's "agent_run" and "application" tasks (Phase 4,
  # dry run: drafts files under data/applications/, never sends anything).
  # Drafting needs an LLM: set GROQ_API_KEY in .env (host Ollama isn't
  # reachable from containers). AGENT_ENABLED=true makes every scan chain
  # an agent run.
  worker:
    build: .
    restart: unless-stopped
    command: python -m backend.worker --grace 30
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-ai_job_agent}
      DB_PASSWORD: ${DB_PASSWORD:-dev_password_change_me}
      DB_NAME: ${DB_NAME:-ai_job_agent}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      AGENT_MIN_SCORE: ${AGENT_MIN_SCORE:-80}
      AGENT_MAX_JOB_AGE_DAYS: ${AGENT_MAX_JOB_AGE_DAYS:-14}
      AGENT_MAX_DRAFTS_PER_RUN: ${AGENT_MAX_DRAFTS_PER_RUN:-5}
    volumes:
      - ./data:/app/data          # profile in; ranked_jobs.json and applications/ out
      - models:/models            # embedding model cache, shared with api/ui
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 45s

  # Scan scheduler (ADR-001 §3): APScheduler with its job store in Postgres,
  # timezone Asia/Kolkata. It only ENQUEUES "scan" tasks (one per scheduled
  # slot -- the idempotency key is the slot's fire time); the worker runs
  # them. Leader election by a Postgres advisory lock: a second copy waits
  # in standby, and a leader that loses its lock connection exits non-zero
  # so `restart` brings it back -- there are never two leaders. Same image;
  # it needs no volumes (no files, no model).
  scheduler:
    build: .
    restart: unless-stopped
    command: python -m backend.scheduler
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-ai_job_agent}
      DB_PASSWORD: ${DB_PASSWORD:-dev_password_change_me}
      DB_NAME: ${DB_NAME:-ai_job_agent}
      SCAN_CRON: ${SCAN_CRON:-0 9 * * *}              # 09:00 IST daily
      SCAN_MISFIRE_GRACE_S: ${SCAN_MISFIRE_GRACE_S:-3600}
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: .
    restart: unless-stopped
    command: streamlit run backend/ui/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-ai_job_agent}
      DB_PASSWORD: ${DB_PASSWORD:-dev_password_change_me}
      DB_NAME: ${DB_NAME:-ai_job_agent}
      # Optional: hosted LLM inside containers (local Ollama isn't reachable
      # from Docker). Set in .env; empty means document generation is off.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - models:/models
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  models:
